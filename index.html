<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigenen en Antistoffen bepalen</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .page-title {
            color: #333333;
            margin-bottom: 30px;
            font-size: 2rem;
            text-align: center;
        }

        .racks-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }

        .rack-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .rack-title {
            color: #4e342e;
            margin-bottom: 12px;
            font-size: 1.4rem;
            text-align: center;
        }

        .rack {
            background-color: #d7ccc8;
            border: 4px solid #8d6e63;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .tube-top {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #e0f2f1, #00897b);
            border: 4px solid #b0bec5;
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.3), 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #ffffff;
            font-weight: bold;
            font-size: 1.1rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
            transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            box-sizing: border-box;
        }

        .tube-top:hover {
            transform: scale(1.1);
            filter: brightness(1.15);
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.2), 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        /* Pop-up venster voor video */
        .video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .video-modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            width: 90%;
            max-width: 800px;
            background: #000000;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 8px;
        }

        .close-btn {
            position: absolute;
            top: -45px;
            right: 0;
            color: #ffffff;
            font-size: 36px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            line-height: 1;
        }

        .close-btn:hover {
            color: #ff5252;
        }
    </style>
</head>
<body>

    <h1 class="page-title">Digitaal laboratorium PO Bloed en Transfusie</h1>

    <div class="racks-container">

        <!-- REK 1: ANTIGENEN BEPALEN -->
        <div class="rack-section">
            <h2 class="rack-title">Antigenen bepalen</h2>
            <div class="rack">
                <div class="row">
                    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="tube-top">1A</a>
                    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="tube-top">2A</a>
                    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="tube-top">3A</a>
                    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="tube-top">XA</a>
                    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="tube-top">YA</a>
                </div>
                <div class="row">
                    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="tube-top">1B</a>
                    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="tube-top">2B</a>
                    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="tube-top">3B</a>
                    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="tube-top">XB</a>
                    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="tube-top">YB</a>
                </div>
            </div>
        </div>

        <!-- REK 2: ANTISTOFFEN BEPALEN -->
        <div class="rack-section">
            <h2 class="rack-title">Antistoffen bepalen</h2>
            <div class="rack">
                <div class="row">
                    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="tube-top">1A</a>
                    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="tube-top">2A</a>
                    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="tube-top">3A</a>
                    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="tube-top">XA</a>
                    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="tube-top">YA</a>
                </div>
                <div class="row">
                    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="tube-top">1B</a>
                    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="tube-top">2B</a>
                    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="tube-top">3B</a>
                    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="tube-top">XB</a>
                    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="tube-top">YB</a>
                </div>
            </div>
        </div>

    </div>

    <!-- Pop-up venster voor video's -->
    <div id="videoModal" class="video-modal">
        <div class="modal-content">
            <span id="closeBtn" class="close-btn">&times;</span>
            <div class="video-wrapper">
                <iframe id="youtubeIframe" src="" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="no-referrer" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        const videoModal = document.getElementById('videoModal');
        const youtubeIframe = document.getElementById('youtubeIframe');
        const closeBtn = document.getElementById('closeBtn');

        function getYouTubeId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        document.querySelectorAll('.tube-top').forEach(button => {
            button.addEventListener('click', function(e) {
                e.preventDefault();
                const url = this.getAttribute('href');
                const videoId = getYouTubeId(url);

                if (videoId) {
                    // Omzeil de 'file://' domeinblokkade van YouTube
                    youtubeIframe.src = 'https://www.youtube-nocookie.com/embed/' + videoId + '?autoplay=1&origin=' + window.location.origin;
                    videoModal.classList.add('active');
                } else {
                    alert('Geen geldige YouTube-link gevonden.');
                }
            });
        });

        function closeModal() {
            videoModal.classList.remove('active');
            youtubeIframe.src = '';
        }

        closeBtn.addEventListener('click', closeModal);
        videoModal.addEventListener('click', function(e) {
            if (e.target === videoModal) {
                closeModal();
            }
        });
    </script>

</body>
</html>
